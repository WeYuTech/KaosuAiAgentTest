<div id="mes-flow-choices" class="reference-designs" aria-label="已選定的兩種 MES 人機協作流程">
  <section data-variant="聊天＋作業單" aria-label="聊天與右側作業單同步"><div class="mf-app" data-flow="split"><header class="mf-header"><span class="mf-brand">WeYu</span><span class="mf-header-title">生產情報助理</span><span class="mf-spacer"></span><span class="mf-demo">互動預覽 · 示意資料</span><button type="button" class="mf-quiet cursor-interaction" data-action="home"><i data-lucide="square-pen" aria-hidden="true"></i>聊天入口</button></header><div class="mf-screen"><div class="mf-pad">聊天＋作業單</div></div></div></section>
  <section data-variant="分步作業精靈" aria-label="依對象內容核對逐步操作" hidden><div class="mf-app" data-flow="wizard"><header class="mf-header"><span class="mf-brand">WeYu</span><span class="mf-header-title">生產情報助理</span><span class="mf-spacer"></span><span class="mf-demo">互動預覽 · 示意資料</span><button type="button" class="mf-quiet cursor-interaction" data-action="home"><i data-lucide="square-pen" aria-hidden="true"></i>聊天入口</button></header><div class="mf-screen"><div class="mf-pad">分步作業精靈</div></div></div></section>
</div>
<script>
(()=>{
  const root=document.getElementById('mes-flow-choices');
  if(!root)return;
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=name=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
  const button=(action,text,primary=false,extra='')=>`<button type="button" class="${primary?'mf-primary':'mf-quiet'} cursor-interaction" data-action="${action}" ${extra}>${text}</button>`;
  const records=Array.from({length:24},(_,index)=>({id:'execution-'+(index+1),wo:'WO-261102-'+String(382+index).padStart(4,'0'),machine:['MC37','MC38','MC41'][Math.floor(index/8)],part:['P-102 外殼','P-208 底座','P-331 支架'][index%3],time:String(8+index%8).padStart(2,'0')+':00',shift:'日班',done:10+index*7,status:index%7===6?'已完工':'生產中'}));
  const initial=()=>({view:'work',step:'target',target:null,choice:null,picker:false,query:'',machine:'MC37',requestMachine:'MC37',page:1,detail:null,good:'120',bad:'3',reason:'刮傷',question:'幫 MC37 報工，良品 120、不良 3，原因刮傷。',answer:'',error:'',homeText:'幫 MC37 報工，良品 120、不良 3，原因刮傷。',lastView:'work'});
  const states=new Map([...root.querySelectorAll('[data-flow]')].map(app=>[app,initial()]));
  function findRecord(id){return records.find(r=>r.id===id);}
  function icons(){if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}});}
  function chosen(s){return findRecord(s.target);}
  function fields(s){return `<div class="mf-fields"><div class="mf-pair"><label><span>良品數量</span><input data-field="good" inputmode="numeric" type="number" min="0" step="1" value="${escapeHtml(s.good)}" aria-label="良品數量"></label><label><span>不良數量</span><input data-field="bad" inputmode="numeric" type="number" min="0" step="1" value="${escapeHtml(s.bad)}" aria-label="不良數量"></label></div><label><span>不良原因</span><select data-field="reason" aria-label="不良原因"><option value="" ${!s.reason?'selected':''}>請選擇</option><option ${s.reason==='刮傷'?'selected':''}>刮傷</option><option ${s.reason==='缺料'?'selected':''}>缺料</option><option ${s.reason==='其他'?'selected':''}>其他</option></select></label></div>`;}
  function targetCard(s){const r=chosen(s);return r?`<div class="mf-target"><div class="mf-target-top"><strong>${r.wo}</strong>${button('picker','更換')}</div><p>${r.part}</p><p class="mf-small mf-muted">${r.machine} · 11/02 ${r.time} · ${r.shift}</p></div>`:`<div class="mf-target"><p class="mf-muted mf-small">需求機台 ${escapeHtml(s.requestMachine||'尚未指定')}</p><div class="mf-target-top"><strong>尚未選擇工單</strong>${button('picker','選擇')}</div></div>`;}
  function editForm(s,quick=false){return `<div class="mf-sheet-title"><h2>${quick?'預填報工單':'本次報工'}</h2><span class="mf-chip">草稿</span></div>${quick&&!s.target?`<div class="mf-alert">${icon('circle-help')}<span>請確認這次的工單與執行紀錄。</span></div>`:''}${targetCard(s)}${fields(s)}<div class="mf-form-foot"><p class="mf-muted mf-small">${s.good!==''&&s.bad!==''?'數量依你的原句帶入；請確認本次內容。':'未提供的數量保留空白，請補齊後核對。'}</p><button type="button" class="mf-primary mf-wide cursor-interaction" data-action="review" ${!s.target?'disabled':''}>核對報工 ${icon('arrow-right')}</button><p class="mf-error" role="alert">${escapeHtml(s.error)}</p></div>`;}
  function summary(s){const r=chosen(s);return `<dl class="mf-review-list"><div><dt>工單</dt><dd>${r?.wo||'尚未選擇'}</dd></div><div><dt>品號</dt><dd>${r?.part||'—'}</dd></div><div><dt>本次執行</dt><dd>${r?.machine||'MC37'} · 11/02 ${r?.time||'—'}</dd></div><div><dt>新增良品</dt><dd>${escapeHtml(s.good)} 件</dd></div><div><dt>新增不良</dt><dd>${escapeHtml(s.bad)} 件 · ${escapeHtml(s.reason)}</dd></div></dl>`;}
  function review(s){return `<div class="mf-review mf-fade"><div class="mf-sheet-title"><h2>核對本次報工</h2><span class="mf-chip">尚未寫入</span></div>${summary(s)}<p class="mf-small mf-muted" style="margin-top:18px">本次新增數量；不代表整張工單完工。</p><div class="mf-actions" style="margin-top:24px">${button('edit','返回修改')}${button('confirm','確認報工',true)}</div></div>`;}
  function receipt(s){const r=chosen(s);return `<div class="mf-receipt mf-fade"><span class="mf-success-icon">${icon('circle-check')}</span><h2>本次流程已完成</h2><p>${r?.wo||''} · ${r?.machine||'MC37'}</p><p>良品 ${escapeHtml(s.good)} 件，不良 ${escapeHtml(s.bad)} 件</p><p class="mf-muted mf-small">這是操作預覽，沒有寫入 MES。</p><div class="mf-actions">${button('again','再試一次',true)}${button('home','回聊天入口')}</div></div>`;}
  function ask(s){return `<div class="mf-question" data-form="help"><input name="question" placeholder="${s.view==='info'?'描述你的需求…':'詢問欄位說明…'}" aria-label="詢問助理" value=""><button type="button" data-action="ask-send" class="cursor-interaction" aria-label="送出問題">${icon('arrow-up')}</button></div><p class="mf-answer" role="status">${escapeHtml(s.answer)}</p>`;}
  function filtered(s){const q=s.query.trim().toUpperCase();return records.filter(r=>(!s.machine||r.machine===s.machine)&&(!q||[r.wo,r.part,r.machine].join(' ').toUpperCase().includes(q)));}
  function rows(s,readOnly=false){const list=filtered(s),pages=Math.max(1,Math.ceil(list.length/4));s.page=Math.min(s.page,pages);const slice=list.slice((s.page-1)*4,s.page*4);return `<table class="mf-table"><thead><tr><th scope="col">${readOnly?'':'選取'}</th><th scope="col">工單 / 品號</th><th scope="col">機台 / 執行時間</th><th scope="col">明細</th></tr></thead><tbody>${slice.map(r=>`<tr data-chosen="${s.choice===r.id}"><td>${readOnly?icon('file-text'):`<label><input type="radio" name="${s.key}-candidate" value="${r.id}" ${s.choice===r.id?'checked':''} ${r.status==='已完工'?'disabled':''} aria-label="選取 ${r.wo}，${r.machine}，${r.time}，${r.status}"></label>`}</td><td><strong>${r.wo}</strong><small>${r.part}</small></td><td><strong>${r.machine}</strong><small>11/02 ${r.time} · ${r.status}</small></td><td>${button('detail','查看',false,`data-id="${r.id}" aria-expanded="${s.detail===r.id}"`)}</td></tr>${s.detail===r.id?`<tr class="mf-detail-row"><td colspan="4" class="mf-row-detail">${r.wo} · ${r.machine} · ${r.shift} ${r.time}　累計良品 ${r.done} 件；狀態：${r.status}。${readOnly?`<div class="mf-actions" style="margin-top:10px">${button('query-use','以此工單報工',true,`data-id="${r.id}" ${r.status==='已完工'?'disabled':''}`)}</div>`:''}</td></tr>`:''}`).join('')}</tbody></table>${!slice.length?'<p class="mf-empty">沒有符合的工單。可調整關鍵字或機台。</p>':''}<div class="mf-page"><span>${list.length} 筆示意資料${list.length?' · '+((s.page-1)*4+1)+'–'+Math.min(s.page*4,list.length):''}</span><div class="mf-actions">${button('prev',icon('chevron-left'),false,`aria-label="上一頁" ${s.page===1?'disabled':''}`)}<span>${s.page} / ${pages}</span>${button('next',icon('chevron-right'),false,`aria-label="下一頁" ${s.page===pages?'disabled':''}`)}</div></div>`;}
  function selection(s,readOnly=false){const r=findRecord(s.choice);return readOnly?`<p class="mf-muted mf-small">查詢只讀取資料；選定工單後才建立報工作業。</p><button type="button" class="mf-primary cursor-interaction" data-action="query-to-work">開始報工 ${icon('arrow-right')}</button>`:`<p class="mf-selection">${r?'已選：'+r.wo+' · '+r.machine:'選擇本次要報工的執行紀錄'}</p><button type="button" class="mf-primary cursor-interaction" data-action="use" ${!r?'disabled':''}>${s.flow==='table'?'加入作業單':s.flow==='wizard'?'下一步':'帶入作業單'} ${icon('arrow-right')}</button>`;}
  function table(s,readOnly=false){return `<div class="mf-picker"><div class="mf-heading"><div><div class="mf-eyebrow">生產報工 · ${readOnly?'唯讀查詢':'選擇對象'}</div><h2>${readOnly?'<span data-machine-label>'+escapeHtml(s.machine||'全部機台')+'</span> 生產資料':'選擇工單'}</h2></div><span class="mf-chip">2026/11/02 · 日班</span></div><div class="mf-filters"><label><span>搜尋工單 / 品號</span><input data-search value="${escapeHtml(s.query)}" placeholder="輸入編號或名稱…" aria-label="搜尋工單或品號"></label><label><span>機台</span><select data-machine aria-label="篩選機台"><option value="" ${s.machine===''?'selected':''}>全部機台</option>${s.machine&&!['MC37','MC38','MC41'].includes(s.machine)?`<option selected>${escapeHtml(s.machine)}</option>`:''}${['MC37','MC38','MC41'].map(m=>`<option ${s.machine===m?'selected':''}>${m}</option>`).join('')}</select></label></div><div data-table-content>${rows(s,readOnly)}</div></div><div class="mf-foot" data-selection>${selection(s,readOnly)}</div>`;}
  function wizardSteps(s){const index={target:0,details:1,review:2,done:3}[s.step]??0;return `<div class="mf-stepper">${['選擇對象','填寫內容','核對送出'].map((x,i)=>`${i?'<span class="mf-step-line"></span>':''}<div class="mf-step" data-current="${i===index}" ${i===index?'aria-current="step"':''}><b>${i<index?'✓':i+1}</b>${x}</div>`).join('')}</div>`;}
  function home(s){return `<div class="mf-home mf-fade"><h1>今天想完成什麼？</h1><div class="mf-compose" data-form="entry"><textarea name="message" aria-label="輸入問題">${escapeHtml(s.homeText)}</textarea><div class="mf-compose-foot"><span class="mf-muted mf-small">直接問問題，或描述作業。</span><button class="mf-primary cursor-interaction" type="button" data-action="entry-send" aria-label="送出問題">${icon('arrow-up')}</button></div></div><div class="mf-examples">${button('example-help','你能幫我做什麼？')}${button('example-query','查 MC37 資料')}${button('example-work','試用報工範例')}</div><div class="mf-answer" role="status">${escapeHtml(s.answer)}</div></div>`;}
  function information(s){return `<div class="mf-inline-thread mf-fade"><div class="mf-user">${escapeHtml(s.homeText)}</div><div class="mf-assistant"><div class="mf-assistant-label">${icon('sparkles')} WeYu</div><p>我能協助生產排程、生產報工、模具上下模，也能先查詢資料。描述需求後，我會帶你選對資料並核對作業內容。</p><div class="mf-actions">${button('example-query','先查 MC37 資料')}${button('example-work','試做一筆報工',true)}</div></div><div class="mf-chat-grow"></div>${ask(s)}</div>`;}
  function split(s){return `<div class="mf-split"><div class="mf-chat"><div class="mf-user">${escapeHtml(s.question)}</div><div class="mf-assistant"><div class="mf-assistant-label">${icon('sparkles')} WeYu <span class="mf-chip">生產報工</span></div><p>${s.step==='review'?'本次報工已整理到作業單，請核對對象與數量。':s.target?'已帶入選定工單。你可以直接修改作業單，或詢問欄位。':'請選這次的工單；已提供的內容會整理到作業單。'}</p>${!s.target?`<div class="mf-actions">${button('picker',icon('search')+' 選擇工單',true)}</div>`:''}</div><div class="mf-chat-grow"></div>${ask(s)}</div><aside class="mf-sheet" aria-label="本次報工作業單">${s.step==='review'?review(s):editForm(s)}</aside></div>`;}
  function wizard(s){return `${wizardSteps(s)}${s.step==='target'?table(s):`<div class="mf-step-content mf-fade">${s.step==='review'?review(s):`<div class="mf-heading"><h2>填寫本次報工</h2><span class="mf-chip">數量已預填</span></div>${targetCard(s)}${fields(s)}<div class="mf-actions" style="margin-top:26px">${button('back-target','上一步')}${button('review','下一步：核對',true)}</div><p class="mf-error" role="alert">${escapeHtml(s.error)}</p>`}${ask(s)}</div>`}`;}
  function render(app){const s=states.get(app);s.flow=app.dataset.flow;s.key=s.flow;const screen=app.querySelector('.mf-screen');let html='';if(s.view==='home')html=home(s);else if(s.view==='info')html=information(s);else if(s.view==='query')html=`<div class="mf-pad" style="padding-bottom:0">${button('home',icon('arrow-left')+' 返回聊天')}</div>${table(s,true)}`;else if(s.picker)html=`<div class="mf-pad" style="padding-bottom:0">${button('close-picker',icon('arrow-left')+' 返回作業')}</div>${table(s)}`;else if(s.step==='done')html=receipt(s);else html=({split,wizard}[s.flow])(s);screen.innerHTML=html;icons();}
  function updateTable(app){const s=states.get(app),holder=app.querySelector('[data-table-content]');if(holder)holder.innerHTML=rows(s,s.view==='query');const footer=app.querySelector('[data-selection]');if(footer)footer.innerHTML=selection(s,s.view==='query');app.querySelectorAll('[data-machine-label]').forEach(el=>el.textContent=s.machine||'全部機台');icons();}
  function route(app,text){const s=states.get(app);s.homeText=text;s.answer='';const machine=text.toUpperCase().match(/MC\d+/)?.[0]||'';if(/能.*做|功能|幫我什麼/.test(text)){s.view='info';}else if(/查|數據|資料/.test(text)&&!/報工/.test(text)){s.view='query';s.query='';s.machine=machine;s.requestMachine=machine;s.page=1;}else if(/報工/.test(text)){s.view='work';s.question=text;const good=text.match(/良品\s*([+\-\d.,]+)/)?.[1]?.replace(/,$/,'')||'';const bad=text.match(/不良\s*([+\-\d.,]+)/)?.[1]?.replace(/,$/,'')||'';s.good=/^\d+$/.test(good)?good:'';s.bad=/^\d+$/.test(bad)?bad:'';s.reason=['刮傷','缺料','其他'].find(x=>text.includes(x))??'';s.machine=machine;s.requestMachine=machine;s.target=null;s.choice=null;s.step='target';s.picker=false;}else{s.view='home';s.answer='你想先查資料，還是開始一筆報工？可以點下方範例。';}render(app);}
  function submitLocal(app,group){const s=states.get(app);if(group.dataset.form==='entry'){const text=group.querySelector('textarea').value.trim();if(text)route(app,text);return;}const input=group.querySelector('input'),question=input.value.trim();if(!question)return;if(s.view==='info'){route(app,question);return;}if(/改成|改為|修改|改到|加到|減到/.test(question)){s.answer='請在作業單修改數量；核對中的內容可按「返回修改」。目前數值尚未改動。';}else{s.answer=/不良|原因/.test(question)?'不良數量是這次新增的數量；原因用來分類不良。現有作業單與核對內容已保留。':/良品|數量/.test(question)?'請填本次新增數量。修改數量後需要重新核對；詢問說明不會改動作業單。':'你可以詢問欄位說明。作業變更請直接在作業單填寫，完成後重新核對。';input.value='';}const answer=app.querySelector('.mf-answer');if(answer)answer.textContent=s.answer;}
  root.addEventListener('input',event=>{const app=event.target.closest('[data-flow]');if(!app)return;const s=states.get(app);if(event.target.matches('[data-field]')){s[event.target.dataset.field]=event.target.value;s.error='';const error=app.querySelector('.mf-error');if(error)error.textContent='';}if(event.target.matches('[data-search]')){s.query=event.target.value;s.page=1;updateTable(app);}});
  root.addEventListener('change',event=>{const app=event.target.closest('[data-flow]');if(!app)return;const s=states.get(app);if(event.target.matches('[data-field]'))s[event.target.dataset.field]=event.target.value;if(event.target.matches('[data-machine]')){s.machine=event.target.value;s.page=1;updateTable(app);}if(event.target.matches('input[type=radio]')){s.choice=event.target.value;app.querySelectorAll('.mf-table tr[data-chosen]').forEach(row=>{row.dataset.chosen=String(row.querySelector('input[type=radio]')?.value===s.choice);});const footer=app.querySelector('[data-selection]');if(footer)footer.innerHTML=selection(s);icons();}});
  root.addEventListener('keydown',event=>{if(event.key!=='Enter'||event.shiftKey||event.isComposing)return;if(!event.target.matches('input[name="question"],textarea[name="message"]'))return;const group=event.target.closest('[data-form]');if(group){event.preventDefault();submitLocal(group.closest('[data-flow]'),group);}});
  root.addEventListener('click',event=>{const control=event.target.closest('[data-action]');if(!control||control.disabled)return;const app=control.closest('[data-flow]');if(!app)return;const s=states.get(app),action=control.dataset.action;
    if(action==='entry-send'||action==='ask-send'){submitLocal(app,control.closest('[data-form]'));return;}
    else if(action==='home'){s.view='home';s.picker=false;s.answer='';}
    else if(action==='example-help'){route(app,'你能幫我做什麼？');return;}
    else if(action==='example-query'){route(app,'查 MC37 的生產資料');return;}
    else if(action==='example-work'){route(app,'幫 MC37 報工，良品 120、不良 3，原因刮傷。');return;}
    else if(action==='picker'){s.picker=true;s.choice=s.target;s.query='';s.machine=chosen(s)?.machine||s.requestMachine||'';s.page=1;}
    else if(action==='close-picker'){s.picker=false;}
    else if(action==='detail'){s.detail=s.detail===control.dataset.id?null:control.dataset.id;updateTable(app);return;}
    else if(action==='prev'||action==='next'){s.page+=action==='prev'?-1:1;updateTable(app);return;}
    else if(action==='use'){if(!s.choice)return;s.target=s.choice;s.picker=false;s.step='details';s.error='';}
    else if(action==='inline-pick'){s.target=control.dataset.id;s.choice=s.target;s.step='details';}
    else if(action==='review'){if(!s.target)return;if(!/^\d+$/.test(s.good)||!/^\d+$/.test(s.bad)){s.error='請填寫良品與不良數量，使用 0 或以上的整數。';}else if(Number(s.bad)>0&&!s.reason){s.error='請選擇不良原因。';}else{s.step='review';s.error='';}}
    else if(action==='edit'){s.step='details';}
    else if(action==='back-target'){s.step='target';s.choice=s.target;}
    else if(action==='confirm'){if(s.step!=='review'||!s.target)return;s.step='done';}
    else if(action==='again'){states.set(app,initial());}
    else if(action==='query-to-work'){s.view='work';s.step='target';s.target=null;s.choice=null;s.good='';s.bad='';s.reason='';s.picker=false;s.question='針對剛才的查詢開始一筆報工。';}
    else if(action==='query-use'){s.view='work';s.step='details';s.target=control.dataset.id;s.choice=s.target;s.good='';s.bad='';s.reason='';s.picker=false;s.requestMachine=chosen(s)?.machine||'';s.question='以 '+chosen(s).wo+' 的這次執行紀錄開始報工。';}
    render(app);
  });
  for(const app of states.keys())render(app);
})();
</script>
