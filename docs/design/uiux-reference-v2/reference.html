<style>
#weyu-ux-reference{font-family:Inter,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light dark;-webkit-font-smoothing:antialiased;line-height:1.55;font-size:14px;color:light-dark(#27292d,#e8e8eb)}
#weyu-ux-reference *{box-sizing:border-box}
#weyu-ux-reference button,#weyu-ux-reference input,#weyu-ux-reference select,#weyu-ux-reference textarea{font:inherit}
#weyu-ux-reference button{cursor:pointer}
#weyu-ux-reference button:disabled{cursor:not-allowed}
#weyu-ux-reference [hidden]{display:none!important}
#weyu-ux-reference .ux-sr{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
#weyu-ux-reference .ux-gallery{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0 16px;font-size:12px}
#weyu-ux-reference .ux-gallery-brand{font-weight:650;font-size:15px;margin-right:auto}
#weyu-ux-reference .ux-gallery-brand span{font-size:12px;font-weight:400;margin-left:8px}
#weyu-ux-reference .ux-gallery label{display:flex;align-items:center;gap:7px;min-width:0}
#weyu-ux-reference .ux-gallery select,#weyu-ux-reference .ux-gallery button{min-height:34px;border:1px solid light-dark(#d8dadd,#45464c);border-radius:7px;padding:5px 9px;background:light-dark(#fff,#222329);color:inherit;max-width:310px}
#weyu-ux-reference .ux-demo-label{opacity:.7}
#weyu-ux-reference .ux-app{--ux-bg:#1d1e20;--ux-panel:#161719;--ux-raised:#252629;--ux-hover:#303135;--ux-text:#ececee;--ux-muted:#aaaab1;--ux-border:#3a3b40;--ux-primary:#ececee;--ux-on-primary:#202124;--ux-accent:#92b7ff;--ux-accent-soft:#26344b;--ux-good:#90cbaa;--ux-good-bg:#21332a;--ux-danger:#f29c9c;--ux-danger-bg:#3e292c;--ux-warn:#e9c285;--ux-warn-bg:#393025;--ux-shadow:0 18px 65px #0006;--ux-side:244px;color-scheme:dark;container-type:inline-size;background:var(--ux-bg);color:var(--ux-text);height:744px;min-height:600px;display:flex;border:1px solid var(--ux-border);border-radius:12px;position:relative;isolation:isolate;overflow:hidden;font-size:14px;line-height:1.55}
#weyu-ux-reference .ux-app[data-theme=light]{--ux-bg:#fff;--ux-panel:#f6f7f8;--ux-raised:#f3f4f6;--ux-hover:#e9ebef;--ux-text:#24272b;--ux-muted:#656b74;--ux-border:#dfe2e7;--ux-primary:#272c33;--ux-on-primary:#fff;--ux-accent:#275caf;--ux-accent-soft:#eaf1fd;--ux-good:#24744a;--ux-good-bg:#e9f5ed;--ux-danger:#b53737;--ux-danger-bg:#fceeed;--ux-warn:#805419;--ux-warn-bg:#fff4df;--ux-shadow:0 18px 65px #27334226;color-scheme:light}
#weyu-ux-reference .ux-app :is(h1,h2,h3,h4,p){margin:0}
#weyu-ux-reference .ux-app h1{font-size:27px;font-weight:550;line-height:1.4;letter-spacing:-.6px}
#weyu-ux-reference .ux-app h2{font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-.3px}
#weyu-ux-reference .ux-app h3{font-size:16px;font-weight:600;line-height:1.5}
#weyu-ux-reference .ux-app small{font-size:12px;color:var(--ux-muted)}
#weyu-ux-reference .ux-app svg.lucide{width:18px;height:18px;display:block;flex:none;stroke-width:1.7}
#weyu-ux-reference .ux-button{border:1px solid var(--ux-border);border-radius:9px;padding:9px 14px;min-height:40px;display:inline-flex;gap:8px;align-items:center;justify-content:center;white-space:nowrap;background:transparent;color:var(--ux-text);transition:background 140ms ease-out,border-color 140ms ease-out;flex-shrink:0}
#weyu-ux-reference .ux-button:hover:not(:disabled){background:var(--ux-hover)}
#weyu-ux-reference .ux-button.primary{background:var(--ux-primary);color:var(--ux-on-primary);border-color:var(--ux-primary);font-weight:550}
#weyu-ux-reference .ux-button.primary:hover:not(:disabled){filter:brightness(.93)}
#weyu-ux-reference .ux-button.danger{background:var(--ux-danger-bg);color:var(--ux-danger);border-color:transparent}
#weyu-ux-reference .ux-button.ghost{border-color:transparent}
#weyu-ux-reference .ux-button.icon{width:36px;min-height:36px;height:36px;padding:8px;border-color:transparent;border-radius:8px}
#weyu-ux-reference .ux-button:disabled{opacity:.43}
#weyu-ux-reference .ux-mold-clear .ux-button{font-weight:550}
#weyu-ux-reference .ux-button.small{min-height:32px;padding:5px 10px;font-size:13px}
#weyu-ux-reference .ux-link{background:none;border:0;color:var(--ux-accent);padding:5px 0;text-align:left;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
#weyu-ux-reference .ux-muted{color:var(--ux-muted)}
#weyu-ux-reference .ux-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#weyu-ux-reference .ux-between{justify-content:space-between}
#weyu-ux-reference .ux-stack{display:flex;flex-direction:column;gap:20px}
#weyu-ux-reference .ux-rule{border:0;border-top:1px solid var(--ux-border);margin:2px 0}
#weyu-ux-reference .ux-tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 8px;border-radius:5px;color:var(--ux-muted);background:var(--ux-raised);white-space:nowrap}
#weyu-ux-reference .ux-tag.good{background:var(--ux-good-bg);color:var(--ux-good)}
#weyu-ux-reference .ux-tag.warn{background:var(--ux-warn-bg);color:var(--ux-warn)}
#weyu-ux-reference .ux-side{width:var(--ux-side);min-width:var(--ux-side);background:var(--ux-panel);display:flex;flex-direction:column;padding:14px 12px 10px;overflow:hidden}
#weyu-ux-reference .ux-brand{font-size:19px;font-weight:650;letter-spacing:-.4px}
#weyu-ux-reference .ux-side-top{display:flex;align-items:center;justify-content:space-between;padding:0 4px 14px}
#weyu-ux-reference .ux-new{width:100%;justify-content:flex-start;border:0;padding:10px}
#weyu-ux-reference .ux-side-list{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:18px;scrollbar-width:thin;scrollbar-color:var(--ux-border) transparent}
#weyu-ux-reference .ux-side-label{font-size:12px;color:var(--ux-muted);padding:12px 10px 6px;display:flex;gap:6px;align-items:center}
#weyu-ux-reference .ux-history-row{height:40px;display:flex;align-items:center;border-radius:8px;margin:2px 0;gap:2px}
#weyu-ux-reference .ux-history-row.current{background:var(--ux-hover)}
#weyu-ux-reference .ux-history-row>button:first-child{min-width:0;flex:1;border:0;background:transparent;color:var(--ux-text);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 10px}
#weyu-ux-reference .ux-history-row .ux-button.icon{opacity:0;width:30px;height:30px;min-height:30px;flex:none;margin-right:4px}
#weyu-ux-reference .ux-history-row:is(:hover,:focus-within) .ux-button.icon,#weyu-ux-reference .ux-history-row.current .ux-button.icon{opacity:1}
#weyu-ux-reference .ux-side-bottom{border-top:1px solid var(--ux-border);padding:12px 4px 0;display:flex;align-items:center;gap:9px}
#weyu-ux-reference .ux-avatar{width:31px;height:31px;display:grid;place-items:center;border-radius:50%;background:var(--ux-hover);font-size:12px;flex:none}
#weyu-ux-reference .ux-side-bottom>div:nth-child(2){flex:1;min-width:0;font-size:13px}
#weyu-ux-reference .ux-side-bottom small{display:block;font-size:11px}
#weyu-ux-reference .ux-grip{width:6px;margin-left:-3px;margin-right:-3px;background:transparent;z-index:3;position:relative;cursor:col-resize;touch-action:none;border:0;padding:0;flex:none}
#weyu-ux-reference .ux-grip:before{content:"";position:absolute;left:2px;top:0;bottom:0;width:1px;background:var(--ux-border);transition:background 140ms}
#weyu-ux-reference .ux-grip:hover:before,#weyu-ux-reference .ux-grip:focus:before{background:var(--ux-accent);width:2px}
#weyu-ux-reference .ux-main{min-width:0;flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
#weyu-ux-reference .ux-top{height:60px;min-height:60px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#weyu-ux-reference .ux-top-title{font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px;min-width:0}
#weyu-ux-reference .ux-top-title>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#weyu-ux-reference .ux-main-content{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
#weyu-ux-reference .ux-home{width:min(100%,760px);margin:clamp(48px,10%,100px) auto 0;padding:0 40px}
#weyu-ux-reference .ux-home h1{text-align:center;margin-bottom:28px}
#weyu-ux-reference .ux-quick{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
#weyu-ux-reference .ux-quick .ux-button{border-radius:22px;font-size:13px;color:var(--ux-muted);min-height:40px;padding:8px 13px}
#weyu-ux-reference .ux-compose{border:1px solid var(--ux-border);border-radius:18px;background:var(--ux-raised);padding:14px 14px 10px;transition:border-color 150ms ease-out;position:relative}
#weyu-ux-reference .ux-compose:focus-within{border-color:var(--ux-muted)}
#weyu-ux-reference .ux-compose textarea{resize:none;width:100%;min-height:48px;max-height:120px;background:transparent;border:0;color:var(--ux-text);font-size:15px;line-height:1.55;padding:0;box-shadow:none;outline-offset:4px}
#weyu-ux-reference .ux-compose textarea::placeholder{color:var(--ux-muted)}
#weyu-ux-reference .ux-compose-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}
#weyu-ux-reference .ux-compose-bottom small{font-size:11px}
#weyu-ux-reference .ux-send{width:34px!important;height:34px!important;min-height:34px!important;border-radius:50%!important;padding:8px!important;background:var(--ux-primary)!important;color:var(--ux-on-primary)!important;flex:none}
#weyu-ux-reference .ux-compose.compact{padding:10px 12px;border-radius:14px}
#weyu-ux-reference .ux-compose.compact textarea{min-height:25px}
#weyu-ux-reference .ux-composer-wrap{padding:12px 28px 18px;width:min(100%,840px);margin:0 auto;flex:none}
#weyu-ux-reference .ux-conversation{flex:1;min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--ux-border) transparent;overscroll-behavior:contain}
#weyu-ux-reference .ux-messages{width:min(100%,790px);margin:0 auto;padding:24px 32px 38px;display:flex;flex-direction:column;gap:25px}
#weyu-ux-reference .ux-message{max-width:100%;font-size:15px;line-height:1.8;overflow-wrap:anywhere}
#weyu-ux-reference .ux-message.user{align-self:flex-end;background:var(--ux-hover);padding:10px 17px;border-radius:20px 20px 5px 20px;max-width:85%;font-size:14px}
#weyu-ux-reference .ux-message.assistant{width:100%;align-self:flex-start}
#weyu-ux-reference .ux-message p+p{margin-top:10px}
#weyu-ux-reference .ux-message .ux-row{margin-top:15px}
#weyu-ux-reference .ux-message-actions{display:flex;gap:4px;margin-top:12px}
#weyu-ux-reference .ux-message-actions .ux-button{color:var(--ux-muted);min-height:28px;height:28px;width:28px;padding:6px}
#weyu-ux-reference .ux-live{display:flex;gap:10px;align-items:center;color:var(--ux-muted);font-size:14px;min-height:32px}
#weyu-ux-reference .ux-spinner{display:inline-flex;flex:none}
#weyu-ux-reference .ux-spinner svg{animation:ux-spin 850ms linear infinite;transform-origin:center}
@keyframes ux-spin{to{transform:rotate(360deg)}}
#weyu-ux-reference .ux-enter{animation:ux-enter 200ms cubic-bezier(.22,.65,.26,1) both}
@keyframes ux-enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
#weyu-ux-reference .ux-skeleton{height:13px;border-radius:5px;background:var(--ux-hover);margin:15px 0;animation:ux-pulse 1400ms ease-in-out infinite}
#weyu-ux-reference .ux-skeleton:nth-child(2){width:86%}
#weyu-ux-reference .ux-skeleton:nth-child(3){width:65%}
@keyframes ux-pulse{50%{opacity:.45}}
#weyu-ux-reference .ux-notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--ux-raised);border-radius:10px;font-size:13px}
#weyu-ux-reference .ux-notice.warn{color:var(--ux-warn);background:var(--ux-warn-bg)}
#weyu-ux-reference .ux-notice.error{color:var(--ux-danger);background:var(--ux-danger-bg)}
#weyu-ux-reference .ux-notice.good{color:var(--ux-good);background:var(--ux-good-bg)}
#weyu-ux-reference .ux-notice>div{flex:1}
#weyu-ux-reference .ux-notice small{display:block;color:inherit;margin-top:3px}
#weyu-ux-reference .ux-result{margin-top:18px;border:1px solid var(--ux-border);border-radius:12px;overflow:hidden;font-size:13px;line-height:1.5}
#weyu-ux-reference .ux-result-top{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
#weyu-ux-reference .ux-result small{font-size:11px}
#weyu-ux-reference .ux-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;line-height:1.5}
#weyu-ux-reference .ux-table th{font-size:12px;font-weight:400;color:var(--ux-muted);text-align:left;background:var(--ux-panel);padding:10px 12px}
#weyu-ux-reference .ux-table td{padding:12px;border-top:1px solid var(--ux-border);vertical-align:middle;overflow-wrap:anywhere}
#weyu-ux-reference .ux-table .number{text-align:right;font-variant-numeric:tabular-nums}
#weyu-ux-reference .ux-table td small{display:block;margin-top:3px}
#weyu-ux-reference .ux-table .ux-button{min-height:30px}

<script>
(()=>{
  const root=document.getElementById('weyu-ux-reference');

  const app=root.querySelector('#ux-app'), chooser=root.querySelector('#ux-scene');

  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const scenes=[
    ['H01','首頁與聊天','空首頁','home'],['H02','首頁與聊天','能力問答','capabilities'],['H03','首頁與聊天','需求不明・自然追問','clarify'],['H04','首頁與聊天','超出範圍・友善引導','unsupported'],['H05','首頁與聊天','AI 未設定・人工入口','unconfigured'],
    ['Q01','查詢與回饋','查詢中・連續旋轉','loading'],['Q02','查詢與回饋','等待較久・可以停止','slow'],['Q03','查詢與回饋','資料列表','results'],['Q04','查詢與回饋','查無資料','empty'],['Q05','查詢與回饋','連線失敗','query-error'],['Q06','查詢與回饋','資料不完整・縮小範圍','partial'],['Q07','查詢與回饋','已停止查詢','cancelled'],['Q08','查詢與回饋','資料詳細內容','result-detail'],
    ['N01','聊天管理','平面清單與拖曳側欄','sidebar'],['N02','聊天管理','搜尋聊天','search'],['N03','聊天管理','封存聊天','archives'],['N04','聊天管理','已刪除聊天','deleted'],['N05','聊天管理','刪除聊天確認','delete-chat'],['N06','聊天管理','重新命名','rename'],
    ['F01','兩種操作模式','聊天＋作業單・選擇對象','sheet-empty'],['F02','兩種操作模式','聊天＋作業單・填寫','sheet-edit'],['F03','兩種操作模式','聊天＋作業單・核對','sheet-review'],['F04','兩種操作模式','分步精靈・選擇對象','wizard-select'],['F05','兩種操作模式','分步精靈・填寫','wizard-edit'],['F06','兩種操作模式','分步精靈・核對','wizard-review'],
    ['P01','大量資料選取','搜尋／篩選／分頁','picker'],['P02','大量資料選取','查看明細・不直接套用','picker-detail'],['P03','大量資料選取','暫選・等待帶入','picker-selected'],['P04','大量資料選取','選取中詢問 AI','picker-ai'],['P05','大量資料選取','單筆報工・返回工單','report-picker'],
    ['B01','三模組作業','報工・多個不良原因','report-multiple'],['B02','三模組作業','報工・修改前後值','report-update'],['B03','三模組作業','報工・刪除單筆核對','report-delete'],['B04','三模組作業','整張排程完工・連動影響','complete'],['B05','三模組作業','模穴數調整','cavities'],['B06','三模組作業','排程新增・多工單','schedule-add'],['B07','三模組作業','排程修改・核對異動','schedule-edit'],['B08','三模組作業','模具・四階段操作','mold-phases'],['B09','三模組作業','下模完成・連動核對','mold-down'],['B10','三模組作業','清除換模紀錄・獨立確認','mold-clear'],
    ['W01','儲存與送出狀態','欄位驗證','validation'],['W02','儲存與送出狀態','正在儲存草稿','saving'],['W03','儲存與送出狀態','草稿儲存失敗','save-error'],['W04','儲存與送出狀態','資料已變更','conflict'],['W05','儲存與送出狀態','核對已過期','expired'],['W06','儲存與送出狀態','正在送出・禁止重複','submitting'],['W07','儲存與送出狀態','完成回執','success'],['W08','儲存與送出狀態','提交被拒絕','rejected'],['W09','儲存與送出狀態','結果未知・僅查核','unknown'],['W10','儲存與送出狀態','寫入未啟用','write-disabled'],
    ['U01','設定','介面設定・切換操作方式','preferences'],['U02','設定','忙碌時延後切換','mode-busy'],['U03','設定','API 設定・核對後儲存','api'],['U04','設定','Agent 設定','agent'],['U05','設定','用量額度','budget'],['U06','設定','API 設定・一般使用者唯讀','api-readonly'],
    ['R01','定時報告','建立定時報告','schedule-report-create'],['R02','定時報告','我的定時報告','schedule-report-list'],['R03','定時報告','尚無定時報告','schedule-report-empty'],['R04','定時報告','執行歷史','schedule-report-history'],['R05','定時報告','報告詳細內容','schedule-report-detail'],['R06','定時報告','刪除定時報告','schedule-report-delete'],
    ['A01','紀錄與統計','操作紀錄・前後差異','audit'],['A02','紀錄與統計','使用統計','usage'],
    ['X01','系統狀態','登入已逾時','session'],['X02','系統狀態','權限不足','permission'],['X03','系統狀態','正在連線','connecting'],
    ['N07','聊天管理','尚無聊天紀錄','sidebar-empty'],['N08','聊天管理','搜尋沒有結果','history-empty'],['N09','聊天管理','搜尋聊天中','history-loading'],['N10','聊天管理','搜尋失敗','history-error'],
    ['P06','大量資料選取','候選讀取中','picker-loading'],['P07','大量資料選取','候選沒有結果','picker-empty'],['P08','大量資料選取','候選查詢失敗','picker-error'],
    ['U07','設定','設定載入中','settings-loading'],['U08','設定','設定載入失敗','settings-error'],
    ['C01','聊天生命週期','訊息送達未知','message-unknown'],['C02','聊天生命週期','長回覆與回到最新','long-reply'],['X04','系統狀態','附屬面板載入失敗','panel-error'],['X05','系統狀態','恢復原本待確認作業','recover-operation'],
  ].map(([id,group,label,key])=>({id,group,label,key}));
  const groups=[...new Set(scenes.map(s=>s.group))];
  chooser.innerHTML=groups.map(g=>`<optgroup label="${g}">${scenes.filter(s=>s.group===g).map(s=>`<option value="${s.key}">${s.id} · ${s.label}</option>`).join('')}</optgroup>`).join('');
  const rows=Array.from({length:24},(_,i)=>({id:'WO-261102-'+String(382+i).padStart(4,'0'),equipment:i<8?'MC37':i<16?'MC38':'MC39',product:['P-102 外殼','P-104 底座','P-108 上蓋'][i%3],status:i%7===6?'已完成':'生產中',good:[120,86,230,48,64,180][i%6],defect:i%4===0?3:0}));
  const messages={
    capabilities:['你能幫我做什麼？','我可以查詢生產資料，也能陪你完成排程、報工和模具作業。','例如「查 MC37 今天的工單」，或直接說「我要報工」。'],
    clarify:['幫我處理 MC37','你想查 MC37 的生產狀況，還是進行一項作業？','我會沿用這台設備，不用再選一次。'],
    unsupported:['測試','你好，我在。你可以直接問生產問題。','例如「MC37 今天做了多少？」'],
    results:['查 MC37 今天的工單','找到 8 筆工單。你可以查看明細，或選一筆繼續作業。',''],
    empty:['查 MC37 今天的工單','這個範圍沒有找到工單。','可以換日期，或查看其他設備。'],
    'query-error':['查 MC37 今天的工單','目前連不上資料來源。','查詢條件已保留。'],
    partial:['查全部工單','資料範圍太大，目前不能顯示完整結果。','請先指定設備或日期。'],
    cancelled:['查 MC37 今天的工單','已停止這次查詢。','你可以修改條件後再查一次。']
  };
  let state={},timer=null,toastTimer=null,returnFocus=null,epoch=0,lastVisualKey='';
  const businessLocked=()=>['unknown','submitting'].includes(state.substate);
  const noFields=()=>state.module==='mold'||['delete','complete'].includes(state.action);
  const btn=(text,action,cls='',extra='')=>`<button type="button" class="ux-button ${cls}" data-action="${action}" ${extra}>${text}</button>`;
  const ibtn=(name,label,action,extra='')=>btn(icon(name),action,'icon',`aria-label="${label}" data-tooltip="${label}" ${extra}`);
  const spin=()=>`<span class="ux-spinner">${icon('loader-circle')}</span>`;
  const notice=(title,text='',type='')=>`<div class="ux-notice ${type}" ${type==='error'?'role="alert"':'role="status"'}>${icon(type==='error'?'circle-alert':type==='good'?'circle-check':'info')}<div>${title}${text?`<small>${text}</small>`:''}</div></div>`;
  const announce=t=>root.querySelector('#ux-announcement').textContent=t;
  function reset(key='home'){
    clearTimeout(timer);timer=null;epoch++;
    state={scene:key,screen:'home',mode:'sheet',theme:root.querySelector('#ux-theme').value,phase:'edit',module:'report',action:'add',dialog:'',draft:'',good:125,defects:[{reason:'刮傷',quantity:3}],note:'',target:rows[0],tentative:null,query:'',equipment:'MC37',page:1,detail:null,askAI:false,aiAnswer:'',pending:false,busy:false,validation:false,approved:false,mobilePane:'task',menu:false,sideOpen:false,collapsed:false,toast:'',substate:'',reportAction:'上模開始',scheduleRows:2,historyQuery:'',reportTitle:'每日生產摘要',reportFrequency:'daily',reportModule:'report',reportEquipment:'MC37',reportTime:'08:00',paused:false,preferenceChoice:'sheet',pendingMode:'',queryDone:false,customUser:'',customReply:'',savingText:'草稿已儲存',readonlySettings:false,reportRequest:'',filterUpdated:false};
    state.reportRecord={id:'RPT-0382-01',good:120,defect:3,time:'11/02 09:10'};
    if(key==='home'||key==='sidebar')state.screen='home';
    else if(messages[key]||['loading','slow','result-detail','unconfigured'].includes(key)){state.screen='chat';state.busy=['loading','slow'].includes(key)}
    else if(['search','archives','deleted','delete-chat','rename'].includes(key)){state.screen='chat';state.scene='capabilities';state.dialog=key}
    else if(['preferences','mode-busy','api','agent','budget'].includes(key)){state.screen='work';state.dialog=key==='mode-busy'?'preferences':key;state.busy=key==='mode-busy';state.substate=key;state.pending=key==='mode-busy';state.phase=key==='mode-busy'?'review':'edit'}
    else if(key.startsWith('schedule-report')){state.screen='reports';if(key==='schedule-report-create'||key==='schedule-report-delete')state.dialog=key;}
    else if(['audit','usage','feedback','feedback-list','feedback-review'].includes(key)){state.screen=key}
    else if(['session','permission','connecting'].includes(key)){state.screen='system'}
    else{
      state.screen='work';
      if(key.startsWith('wizard'))state.mode='wizard';
      if(key.endsWith('review')){state.phase='review';state.pending=true}
      if(key==='sheet-empty'||key==='wizard-select'){state.target=null;state.phase='select'}
      if(key.startsWith('picker')||key==='report-picker'){state.dialog='picker';state.tentative=key==='picker-selected'?rows[0]:null;state.detail=key==='picker-detail'?rows[0].id:null;state.askAI=key==='picker-ai';state.aiAnswer=state.askAI?'可用設備、工單或品號搜尋。先查看明細，再按「帶入作業」。':'';state.pickerLevel=key==='report-picker'?'report':'order';state.target=key==='report-picker'?rows[0]:null;state.action=key==='report-picker'?'update':'add';}
      if(key==='report-multiple')state.defects.push({reason:'毛邊',quantity:2});
      if(key==='report-update'){state.action='update';state.phase='review';state.pending=true;}
      if(key==='report-delete'){state.action='delete';state.phase='review';state.pending=true;}
      if(key==='complete'){state.action='complete';state.phase='review';state.pending=true;}
      if(key==='cavities')state.action='cavities';
      if(key.startsWith('schedule-')){state.module='schedule';state.action=key==='schedule-edit'?'update':'add';if(key==='schedule-edit'){state.phase='review';state.pending=true;}}
      if(key.startsWith('mold-')){state.module='mold';state.action=key==='mold-clear'?'clear':key==='mold-down'?'down':'phases';if(key!=='mold-phases'){state.phase='review';state.pending=true;}}
      if(['validation','saving','save-error','conflict','expired','submitting','success','rejected','unknown','write-disabled'].includes(key)){state.substate=key;state.validation=key==='validation';state.good=key==='validation'?'':125;if(['expired','submitting','success','rejected','unknown','write-disabled'].includes(key)){state.phase='review';state.pending=true;}state.busy=['saving','submitting'].includes(key);}
    }
    if(key==='api-readonly'){state.screen='work';state.dialog='api';state.readonlySettings=true;}
    if(key==='sidebar-empty'){state.screen='home';state.emptyHistory=true;}
    if(key.startsWith('history-')){state.screen='chat';state.dialog='search';state.historyStatus=key.replace('history-','');}
    if(key==='picker-empty')state.query='找不到的工單';
    if(key.startsWith('settings-')){state.screen='work';state.dialog='settings-state';state.sharedStatus=key.replace('settings-','');}
    if(key==='panel-error'){state.screen='work';state.dialog='panel-error';}
    if(key==='recover-operation'){state.screen='work';state.dialog='recover-operation';}
    if(key==='message-unknown'||key==='long-reply'){state.screen='chat';state.busy=false;}
    chooser.value=key;render();
  }
  function composer(where,compact=false){
    const loading=state.busy&&state.screen==='chat';
    const unavailable=state.scene==='unconfigured'||state.scene==='message-unknown'||businessLocked()||loading;
    return `<form class="ux-compose ${compact?'compact':''}" data-compose="${where}"><label class="ux-sr" for="ux-composer">訊息</label><textarea id="ux-composer" data-input="draft" rows="${compact?1:2}" placeholder="${businessLocked()?'請先完成或查核目前操作':where==='picker'?'補充條件，或詢問這些資料…':where==='home'?'問資料，或說說你想完成的作業…':state.screen==='work'?'補充需求，或問我怎麼填…':'輸入訊息…'}" ${unavailable?'disabled':''}>${esc(state.draft)}</textarea><div class="ux-compose-bottom"><small>${where==='home'?'':where==='picker'?'對話與已選項目會保留':state.screen==='work'?'核對後才會送出':'Enter 送出 · Shift + Enter 換行'}</small>${loading?btn(icon('square'),'stop','icon ux-send','aria-label="停止查詢"'):btn(icon('arrow-up'),'send','icon ux-send',`aria-label="送出訊息" ${unavailable||!state.draft.trim()?'disabled':''}`)}</div></form>`;
  }
  function sidebar(){return `<aside class="ux-side" aria-label="聊天清單"><div class="ux-side-top">${btn(icon('square-pen')+'新聊天','new','ux-new')}<div class="ux-row" style="gap:0">${ibtn('search','搜尋聊天','search')}${ibtn('panel-left-close','收合側欄','collapse-side')}</div></div><div class="ux-side-list"><div class="ux-side-label">已釘選</div><div class="ux-history-row">${btn('每日生產追蹤','open-chat')}${ibtn('ellipsis','聊天選項','history-menu')}</div><div class="ux-history-row">${btn('本週排程調整','open-chat')}${ibtn('ellipsis','聊天選項','history-menu')}</div><div class="ux-side-label">最近聊天</div>${['MC37 今日生產','新增人工報工','模具上下模','查詢昨日產量','排程工單確認','生產異常追蹤','本週工單進度','修改報工數量','MC38 生產資料','模穴數調整'].map((t,i)=>`<div class="ux-history-row ${i===0&&state.screen!=='home'?'current':''}">${btn(t,'open-chat')}${ibtn('ellipsis','聊天選項','history-menu')}</div>`).join('')}</div><div class="ux-side-bottom ux-usage"><div class="ux-usage-row"><span>用量</span><span>US$2.21 / US$20.00</span></div><div class="ux-usage-bar" role="meter" aria-label="本次真實模型驗收用量" aria-valuemin="0" aria-valuemax="20" aria-valuenow="2.21"><span style="width:11%"></span></div></div></aside><button class="ux-grip" type="button" role="separator" aria-orientation="vertical" aria-label="調整側欄寬度" aria-valuemin="220" aria-valuemax="360" aria-valuenow="244" data-resize></button>`;}
  function top(){const title=state.screen==='system'?'':state.screen==='work'?(state.module==='report'?'生產報工':state.module==='schedule'?'生產排程':'模具上下模'):state.screen==='reports'?'定時報告':state.screen==='home'?'':'MC37 今日生產';return `<header class="ux-top"><div class="ux-top-title">${ibtn('panel-left','展開側欄','open-side','class="ux-phone-open"')}<span>${title}</span>${state.screen==='work'?`<span class="ux-tag">${state.mode==='sheet'?'聊天＋作業單':'分步精靈'}</span>`:''}</div></header>`;}
  function home(){return `<main class="ux-main-content"><div class="ux-home ux-enter"><h1>今天想完成什麼？</h1>${state.dialog?'':composer('home')}<div class="ux-quick">${btn(icon('calendar-days')+'生產排程','start-schedule')}${btn(icon('clipboard-list')+'生產報工','start-report')}${btn(icon('wrench')+'模具上下模','start-mold')}</div></div></main>`;}
  function chat(){
    const key=state.scene==='result-detail'?'results':state.scene;
    const m=messages[key]||['查 MC37 今天的工單','',''];
    let reply='';
    if(state.scene==='message-unknown'){reply=notice('訊息是否送達，尚未確認','原句已保留，先查核這次訊息。','warn')+`<div class="ux-row">${btn('查核訊息狀態','reconcile-message','small')}</div>`;}
    else if(state.scene==='long-reply'){reply=`<p>以下是 MC37 的生產資料整理。</p>${Array.from({length:7},(_,i)=>`<section style="margin-top:22px"><h3>${i+1}. ${['目前生產','工單進度','人工報工','不良品紀錄','待完成工單','模具狀態','下一步'][i]}</h3><p>工單 ${rows[i].id} · ${rows[i].product}</p><p class="ux-muted">人工報工與設備資料分別顯示。尚無設備資料時，會標示未取得，不會當作產量為零。</p></section>`).join('')}`;}
    else if(state.busy){reply=`<div class="ux-live" role="status">${spin()}<span>${state.scene==='slow'?'查詢時間較長，仍在處理…':'正在查詢 MC37 的工單…'}</span></div><div style="margin-top:20px"><div class="ux-skeleton"></div><div class="ux-skeleton"></div><div class="ux-skeleton"></div></div>${state.scene==='slow'?btn('停止查詢','stop','small'):''}`;}
    else if(state.scene==='unconfigured'){reply=`${notice('AI 尚未設定','可先使用作業單完成操作。')}<div class="ux-row">${btn('生產排程','start-schedule','small')}${btn('生產報工','start-report','small')}${btn('模具上下模','start-mold','small')}</div>`;}
    else{reply=`<p>${esc(state.customReply||m[1])}</p>${m[2]?`<p class="ux-muted">${m[2]}</p>`:''}`;
      if(['capabilities','clarify'].includes(key))reply+=`<div class="ux-row">${btn(icon('search')+'查生產資料','query','small')}${btn('我要報工','start-report','small')}${key==='capabilities'?btn('其他作業','more-actions','small'):''}</div>`;
      if(key==='results')reply+=resultTable(state.scene==='result-detail');
      if(key==='empty')reply+=`<div class="ux-row">${btn('修改條件','query-filters','small')}${btn('查看全部設備','query','small ghost')}</div>`;
      if(key==='query-error')reply+=`<div class="ux-row">${btn(icon('refresh-cw')+'重新查詢','query','small')}${btn('修改條件','query-filters','small ghost')}</div>`;
      if(key==='partial')reply+=`<div class="ux-row">${btn('只查 MC37','query','small')}${btn('設定查詢範圍','query-filters','small ghost')}</div>`;
      if(key==='cancelled')reply+=`<div class="ux-row">${btn('重新查詢','query','small')}</div>`;
      reply+=`<div class="ux-message-actions">${ibtn('copy','複製回覆','copy')}${ibtn('thumbs-up','回覆有幫助','thanks')}</div>`;
    }

bled':'')}</div></div><details><summary>進階設定</summary><div class="ux-form">${field('優先序',input('schedulePriority',state.schedulePriority,'number','min="0"'))}${field('備註',`<textarea data-input="note" maxlength="1000">${esc(state.note)}</textarea>`)}</div></details></div>`;

  function render(){

    const activePick=active?.dataset?.pick,activeMode=active?.matches?.('[data-mode]')?active.value:null,activeAction=active?.dataset?.action;

    const visualKey=[state.screen,state.phase,state.mode,state.module,state.action,state.dialog,state.scene].join('|');
    app.dataset.theme=state.theme;app.classList.toggle('side-open',state.sideOpen);app.classList.toggle('side-collapsed',state.collapsed);

  function closeDialog(){const isPicker=state.dialog==='picker';state.dialog='';state.askAI=false;if(isPicker)state.tentative=null;render();const el=returnFocus?.dataset?.action?app.querySelector(`[data-action="${returnFocus.dataset.action}"]`):null;(el||app.querySelector('[data-action="menu"]'))?.focus({preventScroll:true});}
  function query(){clearTimeout(timer);const current=++epoch;state.screen='chat';state.scene='loading';state.busy=true;state.dialog='';render();announce('正在查詢');timer=setTimeout(()=>{if(current!==epoch)return;state.scene='results';state.busy=false;state.customReply='';render();announce('查詢完成，找到 8 筆工單')},1700);}
  function send(){
    const text=state.draft.trim();if(!text||state.busy||businessLocked()||state.scene==='message-unknown')return;state.draft='';
    if(state.dialog==='picker'){
      state.aiAnswer=/MC38|38/.test(text)?'已改查 MC38。尚未帶入作業，原草稿保持不變。':/MC37|37/.test(text)?'已改查 MC37，已選項目會保留。':'不良原因是產品不合格的分類。先確認現場情況，再填原因與數量。';
      if(/MC38|38/.test(text)){state.equipment='MC38';state.page=1;state.filterUpdated=true;}if(/MC37|37/.test(text)){state.equipment='MC37';state.page=1;state.filterUpdated=true;}render();announce(state.aiAnswer);return;
    }
    if(state.screen==='work'){
      const qty=text.match(/良品.*?(\d+)/);
      if(qty){state.good=Number(qty[1]);state.aiAnswer=`已將良品改為 ${state.good} 件，請重新核對。`;state.phase='edit';state.pending=false;state.substate='';}
      else state.aiAnswer='不良原因用來記錄這次的不合格類型。你的作業內容與核對狀態已保留。';render();announce(state.aiAnswer);return;
    }
    state.customUser=text;state.screen='chat';
    if(/報工/.test(text)&&!/能|什麼|如何/.test(text)){startModule('report');return;}
    if(/排程/.test(text)&&/要|新增|安排|改/.test(text)){startModule('schedule');return;}
    if(/上模|下模/.test(text)){startModule('mold');return;}
    if(/查|MC\d|產量|多少/.test(text)){query();return;}
    state.scene=/能|功能|幫.*什麼/.test(text)?'capabilities':/處理|幫我/.test(text)?'clarify':'unsupported';render();announce('收到回覆');
  }
  function startModule(module){clearTimeout(timer);epoch++;state.screen='work';state.module=module;state.phase='select';state.target=null;state.action='add';state.dialog='';state.busy=false;state.substate='';state.pending=false;state.mobilePane='task';render();}
  const actions={
    latest:()=>{const viewport=app.querySelector('.ux-conversation');viewport?.scrollTo({top:viewport.scrollHeight,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});},

    'reconcile-message':()=>{state.scene='results';state.draft='';render();announce('訊息已送達，示範查詢結果已恢復')},
    new:()=>reset('home'),'open-chat':()=>reset('results'),query,send,
    stop:()=>{clearTimeout(timer);epoch++;state.busy=false;state.scene='cancelled';render();announce('已停止查詢')},

    'start-report':()=>startModule('report'),'start-schedule':()=>startModule('schedule'),'start-mold':()=>startModule('mold'),
    picker:()=>{state.tentative=null;state.pickerLevel='order';openDialog('picker')},'cancel-picker':closeDialog,'close-dialog':closeDialog,
    'pick-detail':e=>{state.detail=state.detail===e.dataset.id?null:e.dataset.id;render()},
    'pick-prev':()=>{state.page=Math.max(1,state.page-1);render()},'pick-next':()=>{state.page++;render()},
    'picker-search':()=>{state.page=1;state.filterUpdated=true;render();announce('查詢條件已更新')},
    'clear-filter':()=>{state.query='';state.equipment='';state.page=1;render()},
    'picker-ai':()=>{state.askAI=!state.askAI;render();app.querySelector('#ux-composer')?.focus()},
    'parent-picker':()=>{state.pickerLevel='order';state.tentative=null;state.detail=null;render()},
    'apply-pick':()=>{if(!state.tentative)return;if(state.equipment&&state.tentative.equipment!==state.equipment){toast('已選項目不在目前範圍，請重新選擇');return;}if(state.pickerLevel==='report'){const index=rows.findIndex(r=>r.id===state.tentative.id);state.reportRecord={id:'RPT-0382-0'+(index+1),good:state.tentative.good,defect:state.tentative.defect,time:'11/02 09:'+String(10+index*10)};state.target=rows[0];}else state.target=state.tentative;state.dialog='';state.askAI=false;state.phase=noFields()?'review':'edit';state.tentative=null;state.substate='';state.pending=noFields();render();announce('已帶入作業');app.querySelector('[data-input="good"],.ux-field input')?.focus({preventScroll:true})},
    'result-detail':e=>{const index=Number(e.dataset.row)||0;const same=state.resultIndex===index;state.resultIndex=index;if(state.screen!=='reports')state.scene=state.scene==='result-detail'&&same?'results':'result-detail';render()},
    'apply-result':()=>{state.screen='work';state.target=rows[state.resultIndex??0];state.phase='edit';state.module='report';state.substate='';render()},
    'snapshot-next':()=>toast('示範快照僅收錄本頁，產品須提供真實分頁'),
    'pane-chat':()=>{state.mobilePane='chat';render()},'pane-task':()=>{state.mobilePane='task';render()},
    'add-defect':()=>{state.defects.push({reason:'毛邊',quantity:0});render()},'remove-defect':e=>{state.defects.splice(Number(e.dataset.index),1);render()},
    review:()=>{if(state.module==='schedule'){state.formError=scheduleDraftError();if(state.formError){render();return;}}if(state.good===''&&state.module==='report'&&!noFields()){state.validation=true;render();app.querySelector('[data-input="good"]')?.focus();return;}state.phase='review';state.pending=true;state.validation=false;state.substate='';state.formError='';render();announce('請核對內容')},
    'back-edit':()=>{if(noFields()){state.pickerLevel=['delete'].includes(state.action)?'report':'order';state.tentative=null;openDialog('picker');}else{state.phase='edit';state.substate='';render()}},
    'cancel-proposal':()=>{state.pending=false;state.phase='edit';state.substate='';state.approved=false;toast('已取消確認，填寫內容保留')},
    submit:()=>{if(businessLocked()||['delete','complete','clear'].includes(state.action)&&!state.approved)return;state.substate='submitting';state.busy=true;render();announce('正在送出');clearTimeout(timer);const current=++epoch;timer=setTimeout(()=>{if(current!==epoch)return;timer=null;state.substate='success';state.busy=false;state.pending=false;if(state.pendingMode){state.mode=state.pendingMode;state.pendingMode='';}render();announce('示範作業已完成，未寫入 MES')},1800)},
    reconcile:()=>{state.substate='unknown';state.toast='正在查核，沒有再次送出';render();const current=++epoch;clearTimeout(timer);timer=setTimeout(()=>{if(current!==epoch)return;state.substate='success';state.toast='';render();announce('示範查核已完成')},1500)},
    'refresh-preview':()=>{state.substate='';state.phase='review';state.pending=true;render()},
    'retry-save':()=>{state.substate='saving';state.busy=true;render();clearTimeout(timer);timer=setTimeout(()=>{state.substate='';state.busy=false;state.savingText='草稿已儲存';render()},900)},
    'next-operation':()=>{state.target=null;state.phase='select';state.pending=false;state.substate='';render()},
    'schedule-row':()=>{state.scheduleRows++;render()},
    'schedule-remove-row':e=>{removeScheduleAllocation(Number(e.dataset.index));render()},
    'mold-phase':e=>{state.reportAction=e.dataset.phase;state.action=e.dataset.phase==='下模完成'?'down':'phase';state.phase='review';state.pending=true;render()},
    'mold-clear':()=>{state.action='clear';state.phase='review';state.pending=true;state.approved=false;render()},
    'save-preferences':()=>{if(state.busy){state.pendingMode=state.preferenceChoice;state.dialog='';toast('處理完成後套用新操作方式');if(!timer){timer=setTimeout(()=>{timer=null;state.busy=false;state.mode=state.pendingMode;state.substate='';state.pendingMode='';render();focusWork();announce('操作方式已切換，草稿保留')},1600)}}else{state.mode=state.preferenceChoice;state.dialog='';render();focusWork();announce('操作方式已切換，草稿保留')}},
    'readonly-settings':()=>{state.readonlySettings=!state.readonlySettings;render()},
    'setting-review':()=>{state.settingKind=state.dialog;state.dialog='setting-review';render()},'back-setting':()=>{state.dialog=state.settingKind;render()},'save-setting':()=>{applySettingsDemo();state.dialog='';toast('示範設定已儲存')},
    'confirm-delete':()=>{state.dialog='';toast('聊天已移至「已刪除聊天」')},'rename-save':()=>{state.dialog='';toast('聊天名稱已更新')},'restore-chat':()=>toast('聊天已還原'),pin:()=>{state.menu=false;toast('聊天已釘選')},'archive-chat':()=>{state.menu=false;toast('聊天已封存')},
    reports:()=>{state.screen='reports';state.scene='schedule-report-list';state.menu=false;state.dialog='';render()},
    'report-create':()=>openDialog('schedule-report-create'),'report-delete':()=>openDialog('schedule-report-delete'),
    'report-pause':()=>{state.paused=!state.paused;render();announce(state.paused?'報告已暫停':'報告已恢復')},
    'report-history':()=>{state.screen='reports';state.scene='schedule-report-history';state.dialog='';render()},'report-detail':()=>{state.scene='schedule-report-detail';render()},
    'parse-report':()=>{state.reportEquipment='MC37';state.reportTime='08:00';render();toast('已填入欄位，請核對')},
    'report-review':()=>{state.dialog='report-review';render()},'create-report':()=>{state.dialog='';state.screen='reports';state.scene='schedule-report-list';toast('定時報告已建立')},'confirm-report-delete':()=>{state.dialog='';state.scene='schedule-report-empty';toast('已刪除定時報告')},
    audit:()=>{state.screen='audit';state.dialog='';render()},usage:()=>{state.screen='usage';state.menu=false;render()},
    'run-filter':()=>query(),copy:()=>toast('回覆已複製（示範）'),thanks:()=>toast('謝謝你的回饋'),
    'refresh-stats':()=>toast('示範資料已更新'),'demo-login':()=>reset('sheet-edit'),
    'send-feedback':()=>{state.screen='feedback-list';toast('已收到回報')},'feedback-return':()=>toast('已退回補充（示範）'),'feedback-approve':()=>toast('已核准為候選案例（示範）')
  };
  root.addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;if(businessLocked()&&['new','open-chat','start-report','start-schedule','start-mold','next-operation','reports','audit','usage','api','agent','budget','archives','deleted','search','picker','query','submit','send'].includes(action)){toast('請先完成或查核目前操作');return;}if(actions[action])actions[action](button);else if(['preferences','api','agent','budget','search','archives','deleted','delete-chat','rename','query-filters','more-actions','report-limit'].includes(action))openDialog(action);});
  root.addEventListener('submit',e=>{if(e.target.matches('[data-compose]')){e.preventDefault();send()}});
  root.addEventListener('focusin',e=>{if(e.target.dataset.input&&state.screen==='work'&&!state.dialog)state.lastWorkFocus=e.target.dataset.input;});
  root.addEventListener('input',e=>{if(e.target.dataset.input){state[e.target.dataset.input]=e.target.value;if(e.target.dataset.input==='good')state.validation=false;if(e.target.dataset.input==='draft'){const send=e.target.closest('form')?.querySelector('[data-action=send]');if(send)send.disabled=e.target.disabled||!state.draft.trim();}}if(e.target.dataset.defectQuantity!==undefined){state.defects[Number(e.target.dataset.defectQuantity)].quantity=Number(e.target.value);const total=app.querySelector('.ux-defects')?.previousElementSibling?.querySelector('small');if(total)total.textContent='合計 '+state.defects.reduce((n,d)=>n+(Number(d.quantity)||0),0)+' 件';}});
  root.addEventListener('change',e=>{
    if(e.target.matches('select[data-input]')){const name=e.target.dataset.input;state[name]=e.target.value;if(name.startsWith('allocation')){syncScheduleInput(name,e.target.value);render();}else if(name.startsWith('settings'))render();}
    else if(e.target.dataset.input?.startsWith('settings'))render();
    if(e.target.matches('[data-pick]')){state.tentative=rows.find(r=>r.id===e.target.dataset.pick);render();announce('已暫選，尚未帶入作業')}
    if(e.target.dataset.defectReason!==undefined)state.defects[Number(e.target.dataset.defectReason)].reason=e.target.value;
    if(e.target.matches('[data-none]')){state.defects=e.target.checked?[]:[{reason:'刮傷',quantity:0}];render()}
    if(e.target.matches('[data-approval]')){state.approved=e.target.checked;render()}
    if(e.target.matches('[data-mode]')){state.preferenceChoice=e.target.value;render()}
    if(e.target.matches('[data-product-theme]')){state.theme=e.target.value;root.querySelector('#ux-theme').value=state.theme;render()}
  });
  root.addEventListener('keydown',e=>{
    if(e.target.matches('#ux-composer')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}
    if(e.key==='Escape'&&state.dialog){e.preventDefault();closeDialog()}
    if(e.key==='Tab'&&state.dialog){const controls=[...app.querySelectorAll('.ux-dialog button,.ux-dialog input,.ux-dialog select,.ux-dialog textarea,.ux-dialog summary')].filter(x=>!x.disabled&&x.offsetParent!==null);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    if(e.target.matches('[data-resize]')&&['ArrowLeft','ArrowRight','Home'].includes(e.key)){e.preventDefault();const width=e.key==='Home'?244:Math.min(360,Math.max(220,(parseInt(app.style.getPropertyValue('--ux-side'))||244)+(e.key==='ArrowRight'?8:-8)));app.style.setProperty('--ux-side',width+'px');e.target.setAttribute('aria-valuenow',width)}
  });
  root.addEventListener('pointerdown',e=>{const handle=e.target.closest('[data-resize]');if(!handle)return;e.preventDefault();handle.setPointerCapture(e.pointerId);const start=e.clientX,width=app.querySelector('.ux-side').getBoundingClientRect().width;const move=ev=>{const next=Math.min(360,Math.max(220,width+ev.clientX-start));app.style.setProperty('--ux-side',next+'px');handle.setAttribute('aria-valuenow',next)};const end=()=>{handle.removeEventListener('pointermove',move);handle.removeEventListener('pointerup',end);handle.removeEventListener('pointercancel',end)};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end)});
  chooser.addEventListener('change',()=>reset(chooser.value));
  root.querySelector('#ux-theme').addEventListener('change',e=>{state.theme=e.target.value;render()});
  root.querySelector('#ux-reset').addEventListener('click',()=>reset(chooser.value));
  globalThis.weyuUXReference={scenes,reset,getState:()=>structuredClone(state),setPreviewHeight:h=>app.style.height=h+'px'};
  reset('home');
})();
